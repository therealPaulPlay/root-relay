spec:
  name: root-relay
  services:
    - name: root-relay-server
      git:
        branch: main
        repo_clone_url: https://github.com/therealPaulPlay/root-relay
      dockerfile_path: Dockerfile
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      envs:
        - key: CLIENT_IP_HEADER
          value: do-connecting-ip


